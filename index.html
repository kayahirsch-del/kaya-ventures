<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaya Hirsch</title>
<meta name="description" content="Book time with Kaya Hirsch and see the products she's building." />
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg-page: #FBF0F2;
    --bg-card: #FFFFFF;
    --bg-card-alt: #FDF6F7;
    --border: #F0CFDA;
    --border-strong: #E4A6BC;
    --rose: #B23A62;
    --rose-deep: #7A2745;
    --text-primary: #2E1B22;
    --text-secondary: #8C6472;
    --text-muted: #C79AAC;
    --font-display: 'Fraunces', Georgia, serif;
    --font-sans: 'Inter', -apple-system, sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    background-image: radial-gradient(circle at 15% 0%, #FCE4EA 0%, transparent 45%);
    font-family: var(--font-sans);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 48px 20px 80px;
  }
  #mt-root { max-width: 720px; margin: 0 auto; }

  .mt-eyebrow { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--rose); margin: 0 0 6px; }
  .mt-hero { text-align: center; margin-bottom: 3rem; }
  .mt-title { font-family: var(--font-display); font-style: italic; font-size: 40px; font-weight: 400; margin: 0; color: var(--rose-deep); }
  .mt-sub { font-size: 14px; color: var(--text-secondary); max-width: 480px; margin: 12px auto 0; line-height: 1.6; }

  .mt-section { margin-bottom: 3rem; }
  .mt-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .mt-section-head h2 { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 20px; color: var(--rose-deep); margin: 0; }
  .mt-section-line { flex: 1; height: 1px; background: var(--border); }

  .mt-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }

  .mt-form label { font-size: 11px; color: var(--text-secondary); display: block; margin: 14px 0 5px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .mt-form label:first-child { margin-top: 0; }
  .mt-form input, .mt-form textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 10px; font-size: 13px; font-family: var(--font-sans); background: #fff; }
  .mt-form textarea { resize: vertical; min-height: 70px; }
  .mt-form input:focus, .mt-form textarea:focus { outline: none; border-color: var(--rose); }
  .mt-submit { margin-top: 20px; border: none; background: var(--rose); color: #fff; border-radius: 30px; padding: 11px 24px; font-size: 13px; font-family: var(--font-sans); font-weight: 500; cursor: pointer; }
  .mt-submit:hover { background: var(--rose-deep); }
  .mt-submit:disabled { opacity: 0.6; cursor: default; }
  .mt-form-msg { font-size: 12.5px; margin-top: 14px; display: none; }
  .mt-form-msg.ok { color: #2C6E42; display: block; }
  .mt-form-msg.err { color: var(--rose-deep); display: block; }

  .mt-products { display: grid; gap: 14px; }
  .mt-product { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; }
  .mt-product-name { font-family: var(--font-display); font-size: 19px; font-weight: 500; color: var(--text-primary); margin: 0 0 6px; }
  .mt-product-pitch { font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin: 0; }
  .mt-product-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .mt-product-links a { font-size: 11.5px; font-family: var(--font-mono); color: var(--rose-deep); background: #F6D9E4; padding: 5px 12px; border-radius: 20px; text-decoration: none; }
  .mt-product-links a:hover { background: var(--border-strong); }
  .mt-empty { text-align: center; padding: 30px 20px; color: var(--text-secondary); font-family: var(--font-display); font-style: italic; font-size: 15px; }

  .mt-footer { text-align: center; margin-top: 40px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); letter-spacing: 0.04em; }

  .mt-signin { position: fixed; top: 20px; right: 20px; font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--rose-deep); background: #fff; border: 1px solid var(--border-strong); padding: 7px 14px; border-radius: 20px; text-decoration: none; }
  .mt-signin:hover { background: var(--bg-card-alt); }
</style>
</head>
<body>

<a class="mt-signin" href="venture-log.html">Sign in</a>

<div id="mt-root">
  <div class="mt-hero">
    <p class="mt-eyebrow">Kaya Hirsch</p>
    <p class="mt-title">Let's meet</p>
    <p class="mt-sub">Tell me a bit about what you'd like to talk about and a few times that work for you — I'll follow up by email to lock in a slot.</p>
  </div>

  <div class="mt-section">
    <div class="mt-section-head">
      <h2>Book time with me</h2>
      <span class="mt-section-line"></span>
    </div>
    <div class="mt-card">
      <form class="mt-form" id="mt-form">
        <label>Name</label>
        <input id="mt-name" required placeholder="Your name" />
        <label>Email</label>
        <input id="mt-email" type="email" required placeholder="you@email.com" />
        <label>What do you want to talk about?</label>
        <input id="mt-topic" placeholder="e.g. product feedback, potential collab" />
        <label>A few times that work for you</label>
        <input id="mt-times" placeholder="e.g. Tues or Wed afternoon, PT" />
        <label>Anything else?</label>
        <textarea id="mt-message" placeholder="Optional message"></textarea>
        <button type="submit" class="mt-submit" id="mt-submit-btn">Request time</button>
        <p class="mt-form-msg" id="mt-form-msg"></p>
      </form>
    </div>
  </div>

  <div class="mt-section">
    <div class="mt-section-head">
      <h2>What I've built</h2>
      <span class="mt-section-line"></span>
    </div>
    <div class="mt-products" id="mt-products"></div>
    <p class="mt-empty" id="mt-products-empty" style="display:none;">Nothing live yet — check back soon.</p>
  </div>

  <p class="mt-footer">kayahirsch.com</p>
</div>

<script>
(function() {
  const SUPABASE_URL = 'https://rtztcvvkzyqjunyctxbh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0enRjdnZrenlxanVueWN0eGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3Mjk3OTIsImV4cCI6MjEwMDMwNTc5Mn0.28THw1ckqCgFqGWLstg_Yi3j_emyfzZ5J5FyIs0juII';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function uid() { return crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now() + Math.floor(Math.random()*1000); }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadProducts() {
    const wrap = document.getElementById('mt-products');
    const empty = document.getElementById('mt-products-empty');
    const { data, error } = await sb.from('public_products').select('*').order('created', { ascending: false });
    if (error) { console.error(error); return; }
    if (!data || data.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    data.forEach(product => {
      const card = document.createElement('div');
      card.className = 'mt-product';
      card.innerHTML = `
        <p class="mt-product-name">${escapeHtml(product.name)}</p>
        <p class="mt-product-pitch">${escapeHtml(product.pitch || '')}</p>
      `;
      if (product.links && product.links.length > 0) {
        const linksWrap = document.createElement('div');
        linksWrap.className = 'mt-product-links';
        product.links.forEach(link => {
          const a = document.createElement('a');
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = link.label || link.url;
          a.addEventListener('click', () => {
            if (window.posthog) posthog.capture('product_link_clicked', { product: product.name, url: link.url });
          });
          linksWrap.appendChild(a);
        });
        card.appendChild(linksWrap);
      }
      wrap.appendChild(card);
    });
  }

  document.getElementById('mt-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgEl = document.getElementById('mt-form-msg');
    const btn = document.getElementById('mt-submit-btn');
    msgEl.className = 'mt-form-msg';
    msgEl.textContent = '';

    const name = document.getElementById('mt-name').value.trim();
    const email = document.getElementById('mt-email').value.trim();
    const topic = document.getElementById('mt-topic').value.trim();
    const times = document.getElementById('mt-times').value.trim();
    const message = document.getElementById('mt-message').value.trim();
    if (!name || !email) return;

    btn.disabled = true;
    const row = {
      id: uid(),
      name: name,
      email: email,
      topic: topic,
      preferred_times: times,
      message: message,
      status: 'new',
      created_at: Date.now()
    };
    const { error } = await sb.from('meeting_requests').insert(row);
    btn.disabled = false;
    if (error) {
      console.error(error);
      msgEl.textContent = 'Something went wrong — mind trying again?';
      msgEl.className = 'mt-form-msg err';
      return;
    }
    if (window.posthog) posthog.capture('meeting_request_submitted', { topic: topic });
    document.getElementById('mt-form').reset();
    msgEl.textContent = "Thanks! I'll email you to confirm a time.";
    msgEl.className = 'mt-form-msg ok';
  });

  loadProducts();
})();
</script>
</body>
</html>
